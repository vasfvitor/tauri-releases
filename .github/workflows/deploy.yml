name: Deploy redirect stub to Pages

# Final deploy before archiving: replaces the prototype site with a
# client-side redirect to the official https://tauri.app/release/

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-stub
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
